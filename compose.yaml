services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: audit_log
      POSTGRES_USER: audit_app
      POSTGRES_PASSWORD: local-audit-password
    ports:
      - "5432:5432"
    volumes:
      - audit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_app -d audit_log"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  audit-postgres-data:
