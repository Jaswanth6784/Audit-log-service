spring:
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit_log}
    username: ${AUDIT_DB_USERNAME:audit_app}
    password: ${AUDIT_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${AUDIT_DB_POOL_SIZE:10}
      connection-timeout: 30000
      validation-timeout: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUDIT_SECURITY_ISSUER_URI}
          jwk-set-uri: ${AUDIT_SECURITY_JWK_SET_URI}
          audiences:
            - ${AUDIT_SECURITY_AUDIENCE:audit-log-service}

audit:
  export:
    key-id: ${AUDIT_EXPORT_KEY_ID}
    private-key: ${AUDIT_EXPORT_PRIVATE_KEY}
    public-key: ${AUDIT_EXPORT_PUBLIC_KEY}
