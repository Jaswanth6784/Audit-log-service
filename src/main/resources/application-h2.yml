spring:
  datasource:
    url: jdbc:h2:mem:auditlog-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false

# Public RFC 8032 test-vector key. Development only; never use it outside the H2 profile.
audit:
  export:
    key-id: local-dev-rfc8032-key
    private-key: MC4CAQAwBQYDK2VwBCIEIJ1hsZ3v/VpguoRK9JLsLMREScVpezJpGXA7rAMcrn9g
    public-key: MCowBQYDK2VwAyEA11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=
  security:
    local:
      admin-password: ${AUDIT_LOCAL_ADMIN_PASSWORD:audit-admin-dev-only}
      writer-password: ${AUDIT_LOCAL_WRITER_PASSWORD:audit-writer-dev-only}
      reader-password: ${AUDIT_LOCAL_READER_PASSWORD:audit-reader-dev-only}
