debug: false

spring:
  application:
    name: audit-log-service
  profiles:
    default: h2
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Tamper-evident audit log service
    java-target: 21

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

audit:
  retention:
    enabled: false
    max-age: 365d
    batch-size: 500
    fixed-delay: 1h
  export:
    max-chain-events: 10000

logging:
  level:
    root: INFO
  structured:
    format:
      console: logstash
